<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Plugin Manager</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #ffffff;
        --edge: rgba(0, 0, 0, 0.12);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #16181c;
          --edge: rgba(255, 255, 255, 0.14);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      main {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      /*
       * Deliberately no -webkit-app-region. A draggable region declared here
       * used to survive into the app window on macOS and swallow every click.
       * The splash is short-lived, so it does not need to be draggable.
       */
      body {
        background: var(--background);
        border: 1px solid var(--edge);
        user-select: none;
        cursor: default;
      }

      main {
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .logo-arrival {
        opacity: 1;
        animation: logo-arrival 560ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .logo {
        display: block;
        width: 168px;
        height: auto;
        transform: scale(1);
        animation: logo-zoom 3000ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes logo-arrival {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      @keyframes logo-zoom {
        from {
          transform: scale(0.92);
        }

        20% {
          transform: scale(1);
        }

        to {
          transform: scale(1.045);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .logo-arrival,
        .logo {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo-arrival">
        <img
          class="logo"
          src="logo.png"
          alt="Plugin Manager"
          width="512"
          height="512"
        />
      </div>
    </main>
  </body>
</html>
