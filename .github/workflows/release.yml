name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, e.g. v0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: --mac
          - os: windows-latest
            platform: --win

    runs-on: ${{ matrix.os }}

    steps:
      # Runs before the checkout so a malformed tag fails with this message
      # rather than an unresolved-ref error. The tag is read from the
      # environment rather than interpolated into the script, so it cannot
      # inject shell.
      - name: Validate the tag input
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$TAG" != v* ]]; then
            echo "::error::Tag must start with 'v' to match the push trigger. Got: $TAG"
            exit 1
          fi

      # A dispatch builds the tag it is about to release, so both trigger
      # paths produce the same artifacts from the same commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          # Electron 41.10+ requires Node >= 22.12 for its build tooling.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the server payload
        run: npm run desktop:build

      - name: Package the desktop app
        run: npx electron-builder ${{ matrix.platform }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            artifacts/*.dmg
            artifacts/*.exe
          draft: false
          generate_release_notes: true
